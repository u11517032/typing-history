<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英打遊戲開發歷程</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 3rem auto;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      margin-bottom: 1rem;
    }

    .tag {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      background-color: #e0e7ff;
      color: #3730a3;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      text-align: center;
      width: 100%;
      padding: 0.6rem 1rem;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <header>
    <h1>英打遊戲開發歷程</h1>
    <p class="subtitle">數位科技概論｜從基礎原型到完整遊戲的迭代開發演進</p>
  </header>

  <main class="container">
    <div class="grid">
      
      <!-- 版本一 -->
      <div class="card">
        <div class="card-header">
          <span class="tag">Version 1</span>
          <h2 class="card-title">英打遊戲 v1</h2>
          <p class="card-desc">靜態原型介面，包含遊戲標題與無作用的開始按鈕。</p>
        </div>
        <a href="https://u11517032.github.io/typing-v1/" target="_blank" rel="noopener noreferrer" class="btn">開啟版本一</a>
      </div>

      <!-- 版本二 -->
      <div class="card">
        <div class="card-header">
          <span class="tag">Version 2</span>
          <h2 class="card-title">英打遊戲 v2</h2>
          <p class="card-desc">加入鍵盤示意圖片與點擊開始按鈕後的音效播放。</p>
        </div>
        <a href="https://u11517032.github.io/typing-v2/" target="_blank" rel="noopener noreferrer" class="btn">開啟版本二</a>
      </div>

      <!-- 版本三 -->
      <div class="card">
        <div class="card-header">
          <span class="tag">Version 3</span>
          <h2 class="card-title">英打遊戲 v3</h2>
          <p class="card-desc">左手 ASDF 鍵盤練習，提示目標按鍵並進行即時計分。</p>
        </div>
        <a href="./v3/index.html" class="btn">開啟版本三</a>
      </div>

      <!-- 版本四 -->
      <div class="card">
        <div class="card-header">
          <span class="tag">Version 4</span>
          <h2 class="card-title">英打遊戲 v4</h2>
          <p class="card-desc">十鍵字母掉落遊戲，支援速度調整與漸進加速機制。</p>
        </div>
        <a href="./v4/index.html" class="btn">開啟版本四</a>
      </div>

    </div>
  </main>

</body>
</html>
