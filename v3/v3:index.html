<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Game - V3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }

    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 360px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 1rem;
    }

    .score-board {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #555;
    }

    .target-char {
      font-size: 4rem;
      font-weight: bold;
      color: #007bff;
      height: 90px;
      line-height: 90px;
      background: #e9ecef;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .keyboard {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .key {
      width: 50px;
      height: 50px;
      line-height: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      border: 2px solid #ccc;
      border-radius: 6px;
      background-color: #fafafa;
      color: #333;
      transition: all 0.15s ease;
    }

    .key.active {
      background-color: #28a745;
      color: #ffffff;
      border-color: #28a745;
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(40, 167, 69, 0.5);
    }

    .btn-start {
      padding: 0.6rem 1.8rem;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: background-color 0.2s;
    }

    .btn-start:hover {
      background-color: #0056b3;
    }

    .nav-link {
      display: inline-block;
      margin-top: 0.5rem;
      color: #6c757d;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">英打練習 V3</div>
    
    <div class="score-board">
      得分：<span id="score">0</span>
    </div>

    <div id="target" class="target-char">-</div>

    <div class="keyboard">
      <div id="key-A" class="key">A</div>
      <div id="key-S" class="key">S</div>
      <div id="key-D" class="key">D</div>
      <div id="key-F" class="key">F</div>
    </div>

    <button id="startBtn" class="btn-start">開始遊戲</button>
    <br>
    <a href="../index.html" class="nav-link">← 回到主選單</a>
  </div>

  <script>
    const keys = ['A', 'S', 'D', 'F'];
    let currentTarget = '';
    let score = 0;
    let isPlaying = false;

    const targetEl = document.getElementById('target');
    const scoreEl = document.getElementById('score');
    const startBtn = document.getElementById('startBtn');

    function setNextTarget() {
      // 隨機選取 A, S, D, F 之一
      const randomIndex = Math.floor(Math.random() * keys.length);
      currentTarget = keys[randomIndex];
      targetEl.textContent = currentTarget;

      // 更新畫面鍵盤亮燈狀態
      keys.forEach(k => {
        const keyEl = document.getElementById(`key-${k}`);
        if (k === currentTarget) {
          keyEl.classList.add('active');
        } else {
          keyEl.classList.remove('active');
        }
      });
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = score;
      isPlaying = true;
      startBtn.textContent = '重新開始';
      setNextTarget();
    }

    startBtn.addEventListener('click', startGame);

    window.addEventListener('keydown', (e) => {
      if (!isPlaying) return;

      const pressedKey = e.key.toUpperCase();

      // 只處理目標鍵範圍內的按鍵
      if (keys.includes(pressedKey)) {
        if (pressedKey === currentTarget) {
          score++;
          scoreEl.textContent = score;
          setNextTarget();
        }
      }
    });
  </script>

</body>
</html>
